name: Full-rate temporal research checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temporal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*_research.py' -v
      - run: python -m research.temporal_robustness --output /tmp/ao-temporal.json
