name: Science validation

on:
  pull_request:
  push:
    branches: [main, science-validation-contract-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/validate_model.py
      - run: python tools/validate_optics_contract.py
      - run: node tools/validate_fourier_psf.js
