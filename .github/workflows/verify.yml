name: Research verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ao-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency lock and audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Verify deployed JavaScript core and interface contracts
        run: npm run check
      - name: Regenerate and verify observational evidence
        run: |
          python research/audit_telemetry.py
          python tools/validate_observations.py
          python tools/validate_model.py
          python -m compileall -q research tools
          git diff --exit-code -- research/generated data/validation_summary.csv
