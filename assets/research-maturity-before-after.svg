<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Optics Wavefront Lab research maturity before and after version 3</title>
  <desc id="desc">Ten-category audit. Total score increases from 51 to 95 out of 100, led by new observation-integrity, sampling-validity, test-parity, and reproducibility evidence.</desc>
